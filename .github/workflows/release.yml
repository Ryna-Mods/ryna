# A bundle release, from a tag `vX.Y.Z`: Ryna-X.Y.Z-forever.zip (every addon bundle.json names, side
# by side) and addons.json, the index the Ryna app reads, signed with the addons key
# (RELEASING.md). Three jobs, so each holds only what it needs:
#   build    no secret, no write: fetches the pinned addon releases and makes the files.
#   sign     the `release` environment (v* tags only): signs addons.json and proves the signature
#            against addons.pub, the key the app carries.
#   publish  the only job that may write: one GitHub Release, never changed afterwards.
# Run it by hand (workflow_dispatch) to build without publishing: from a branch nothing is signed;
# from a tag with dry_run ticked it signs and checks, and still publishes nothing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything and keep it as a workflow artifact; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node --test scripts/publish.test.mjs
      # Only a signed, annotated tag on a commit that is on main releases anything.
      - name: The tag is signed and on main
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; a release needs a signed one (git tag -s)"; exit 1
          fi
          verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .verification.verified)"
          if [ "$verified" != true ]; then
            echo "::error::$GITHUB_REF_NAME isn't signed by a key GitHub verifies"; exit 1
          fi
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .status)"
          case "$status" in
            identical|ahead) echo "$GITHUB_REF_NAME: signed, and $GITHUB_SHA is on main" ;;
            *) echo "::error::$GITHUB_SHA isn't on main (compare says $status)"; exit 1 ;;
          esac
      # The index the app last saw, when there is one: this release must not go back on it.
      - name: The published index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only "there is no release" (404) means the first index; any other failure stops here,
          # so a bad moment at GitHub can't skip the check.
          if latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>latest.err)"; then
            gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern addons.json --pattern addons.json.sig --dir previous
            node scripts/publish.mjs verify previous
          elif grep -q "HTTP 404" latest.err; then
            echo "No release yet: this is the first index."
          else
            cat latest.err; echo "::error::couldn't read the latest release"; exit 1
          fi
      # The tag is the bundle's version, and the version is the index's serial (0.5.1 is 5001).
      # A run that isn't from a tag builds the next patch.
      - name: The version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -f previous/addons.json ]; then
            version="$(node scripts/publish.mjs next --previous previous/addons.json)"
          else
            version="$(node scripts/publish.mjs next)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle $version"
      - name: Build the bundle and the index
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          previous=()
          if [ -f previous/addons.json ]; then previous=(--previous previous/addons.json); fi
          node scripts/publish.mjs build --version "$VERSION" --out dist --notes notes.md "${previous[@]}"
          cat dist/addons.json
          unzip -tq "dist/Ryna-${VERSION}-forever.zip"
          cp notes.md dist/NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built
          path: dist/*
          if-no-files-found: error

  sign:
    needs: build
    if: github.ref_type == 'tag'
    # The addons key lives here and nowhere else; the environment admits only v* tags.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built
          path: dist
      # The Tauri CLI from this repository's lockfile: the tool that signs the app's own updates,
      # so the .sig is exactly what the app checks. No install script runs.
      - run: npm ci --ignore-scripts
      - name: Sign addons.json
        env:
          KEY: ${{ secrets.ADDONS_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ADDONS_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then
            echo "::error::ADDONS_SIGNING_PRIVATE_KEY isn't set in the release environment; an unsigned index is never published"; exit 1
          fi
          # The key is one line of base64; a newline that came along with the secret would spoil it.
          TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          export TAURI_SIGNING_PRIVATE_KEY
          npx --no-install tauri signer sign "$GITHUB_WORKSPACE/dist/addons.json" > /dev/null
          test -s dist/addons.json.sig
      # The app carries addons.pub; a signature it wouldn't accept stops the release here.
      - run: node scripts/publish.mjs verify dist
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          mv dist/NOTES.md notes.md
          (cd dist && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS dist/
          cat dist/SHA256SUMS
          mv notes.md dist/NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, sign]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv dist/NOTES.md notes.md
          # A published release is never changed, not even its files: a fix is the next version.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME already has a release, and a published release is never changed. Tag the next version."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Ryna $VERSION" --notes-file notes.md
